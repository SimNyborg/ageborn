name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Skip until the project is scaffolded
        id: guard
        run: |
          if [ -f package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No package.json yet"; fi
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci
      - if: steps.guard.outputs.ready == 'true'
        run: npm run typecheck
      - if: steps.guard.outputs.ready == 'true'
        run: npm run lint
      - if: steps.guard.outputs.ready == 'true'
        run: npm test
      - if: steps.guard.outputs.ready == 'true'
        run: npm run build
      - if: steps.guard.outputs.ready == 'true'
        name: Bundle size gate
        run: npm run size --if-present

  # DESIGN B13 / C4.1: the e2e specs against the production build, in Chromium and WebKit
  # (docs/requests/wp12-ci.md; the balance jobs follow in Phase 3).
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      # One line per failed and flaky test at the end of the log (the annotations stop after ten errors).
      - name: E2E summary
        if: always()
        run: npx tsx tools/e2eSummary.ts test-results/e2e-results.json
      # The HTML report carries the failed tests' traces; the rest of test-results stays out of the artifact.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
