<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ageborn</title>
  <style>
    :root { --bg: #14110f; --fg: #f3ead8; --muted: #b9ab93; --accent: #f0a53c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 120%, #3a2414 0%, var(--bg) 60%); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    main { text-align: center; max-width: 520px; }
    h1 { font-size: clamp(40px, 10vw, 72px); letter-spacing: 0.04em; margin: 0 0 8px; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 18px; line-height: 1.5; margin: 0 0 24px; }
    .lane { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #3d7bd9, #6b5a45 45%, #6b5a45 55%, #e0772e); position: relative; overflow: hidden; }
    .lane::after { content: ""; position: absolute; top: 0; left: -30%; width: 30%; height: 100%; background: rgba(255,255,255,0.5); animation: sweep 2.4s ease-in-out infinite; }
    @keyframes sweep { to { left: 100%; } }
    @media (prefers-reduced-motion: reduce) { .lane::after { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Age<span>born</span></h1>
    <p>From clubs to lasers in one battle. The first playable build is on its way.</p>
    <div class="lane" aria-hidden="true"></div>
  </main>
</body>
</html>
