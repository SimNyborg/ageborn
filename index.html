<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1a2e" />
    <meta name="description" content="Ageborn: a one-lane battler across eight ages. No purchases, no ads." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ageborn</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1a2e; color: #f4ecd8; overflow: hidden; -webkit-touch-callout: none; }
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; touch-action: none; }
      #app { position: fixed; inset: 0; }
      /* The splash paints with the HTML (perf audit 2026-10-01: nothing painted until boot returned).
         main.tsx fades it out once the first screen is drawn. Static art only; no text to translate. */
      #splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none;
        background: radial-gradient(120% 90% at 50% 38%, #2f2b52 0%, #1b1a2e 55%, #121122 100%); transition: opacity 0.32s ease-out; }
      #splash.is-out { opacity: 0; }
      #splash .sp { display: grid; justify-items: center; gap: 18px; animation: sp-in 0.6s cubic-bezier(0.2, 1.3, 0.4, 1) both; }
      #splash svg { width: min(30vmin, 132px); height: auto; filter: drop-shadow(0 6px 18px rgba(242, 193, 78, 0.28)); animation: sp-bob 2.4s ease-in-out 0.6s infinite; }
      #splash .bar { width: min(46vmin, 220px); height: 6px; border-radius: 3px; background: rgba(244, 236, 216, 0.12); overflow: hidden; }
      #splash .bar i { display: block; height: 100%; width: 38%; border-radius: 3px;
        background: linear-gradient(90deg, rgba(242, 193, 78, 0), #f2c14e 45%, #ffe7a3 55%, rgba(242, 193, 78, 0)); animation: sp-run 1.25s ease-in-out infinite; }
      @keyframes sp-in { from { opacity: 0; transform: translateY(10px) scale(0.92); } to { opacity: 1; transform: none; } }
      @keyframes sp-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes sp-run { from { transform: translateX(-110%); } to { transform: translateX(290%); } }
      @media (prefers-reduced-motion: reduce) { #splash .sp, #splash svg, #splash .bar i { animation: none; } #splash .bar i { width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash" aria-hidden="true">
      <div class="sp">
        <svg viewBox="0 0 120 96" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a3" /><stop offset="1" stop-color="#e0a23a" /></linearGradient>
          </defs>
          <ellipse cx="60" cy="86" rx="52" ry="7" fill="#000" opacity="0.28" />
          <rect x="6" y="70" width="108" height="12" rx="4" fill="#7a5c3a" />
          <rect x="6" y="70" width="108" height="4" rx="2" fill="#a07a4c" />
          <rect x="10" y="40" width="20" height="30" rx="4" fill="#4f8fd6" stroke="#20304a" stroke-width="3" />
          <rect x="90" y="40" width="20" height="30" rx="4" fill="#d65a4f" stroke="#4a2020" stroke-width="3" />
          <path d="M60 8 L80 52 H40 Z" fill="url(#spg)" stroke="#6b4a14" stroke-width="3" stroke-linejoin="round" />
          <path d="M60 18 L66 34 H54 Z" fill="#fff6d6" opacity="0.7" />
        </svg>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
